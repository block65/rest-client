name: CI

on:
  push:
    branches: ["canary", "master"]
  pull_request:
    branches: ["canary", "master"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        version: [26]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.version }}
          cache: "pnpm"

      - run: pnpm install

      # Spelled out rather than `just`, which runners do not ship.
      - run: pnpm exec oxlint --type-aware --type-check
      - run: pnpm exec oxlint --format=github
      - run: pnpm exec oxfmt --check
      - run: pnpm exec vitest run
      - run: pnpm exec fallow
